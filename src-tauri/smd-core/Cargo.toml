[package]
name = "smd-core"
version = "0.3.18"
edition = "2021"
description = "Core logic for smd (Simple Markdown Viewer)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

[dev-dependencies]
tempfile = "3"
