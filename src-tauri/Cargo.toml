[package]
name = "smd"
version = "0.1.1"
description = "Simple Markdown Viewer"
edition = "2021"

[lib]
name = "smd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "smd"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
