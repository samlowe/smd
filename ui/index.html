<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>smd</title>
  <!-- Apply cached theme vars immediately to avoid flash -->
  <script>
    try {
      var cached = localStorage.getItem('smd-cached-vars');
      if (cached) {
        var vars = JSON.parse(cached);
        var style = document.createElement('style');
        var css = '';
        for (var k in vars) css += k + ':' + vars[k] + ';\n';
        style.textContent = css;
        document.head.appendChild(style);
      }
    } catch(e) {}
  </script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="hljs-theme.css">
</head>
<body>
  <div id="toolbar">
    <div class="toolbar-left">
      <button id="btn-drawer" title="File browser (Ctrl+B)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/>
          <line x1="5.5" y1="2.5" x2="5.5" y2="13.5"/>
        </svg>
      </button>
      <button id="btn-open" title="Open file (Ctrl+O)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M2 13V3a1 1 0 011-1h4l2 2h4a1 1 0 011 1v1M2 13l2-6h11l-2 6H2z"/>
        </svg>
      </button>
      <button id="btn-recent" title="Recent files">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="8" cy="8" r="6"/>
          <polyline points="8,4.5 8,8 10.5,9.5"/>
        </svg>
      </button>
      <span id="filename"></span>
      <button id="btn-clipboard" title="Load from clipboard (Ctrl+Shift+V)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="5.5" y="5.5" width="8.5" height="9" rx="1.5"/>
          <path d="M11 5.5V4A1.5 1.5 0 009.5 2.5h-6A1.5 1.5 0 002 4v6A1.5 1.5 0 003.5 11.5H5"/>
        </svg>
      </button>
      <button id="btn-reload" title="Reload file (Ctrl+R)" style="display:none">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M13.5 8A5.5 5.5 0 113.5 5.5"/>
          <polyline points="1,5.5 3.5,5.5 3.5,3"/>
        </svg>
      </button>
      <button id="btn-copy" title="Copy content" style="display:none">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="5" y="5" width="8.5" height="9" rx="1.5"/>
          <path d="M11 5V3.5A1.5 1.5 0 009.5 2h-6A1.5 1.5 0 002 3.5v6A1.5 1.5 0 003.5 11H5"/>
        </svg>
      </button>
    </div>
    <div class="toolbar-right">
      <button id="btn-zoom-out" title="Zoom out (Ctrl+-)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5M5 7h4"/>
        </svg>
      </button>
      <span id="zoom-level">100%</span>
      <button id="btn-zoom-in" title="Zoom in (Ctrl++)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5M5 7h4M7 5v4"/>
        </svg>
      </button>
      <button id="btn-theme" title="Theme picker (Ctrl+T)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="8" cy="8" r="6.5"/>
          <circle cx="5.5" cy="6" r="1" fill="currentColor" stroke="none"/>
          <circle cx="8" cy="4.5" r="1" fill="currentColor" stroke="none"/>
          <circle cx="10.5" cy="6" r="1" fill="currentColor" stroke="none"/>
          <circle cx="5.5" cy="9" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </button>
      <button id="btn-about" title="About smd">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="8" cy="8" r="6.5"/>
          <line x1="8" y1="7.5" x2="8" y2="11"/>
          <circle cx="8" cy="5.5" r="0.5" fill="currentColor" stroke="none"/>
        </svg>
      </button>
    </div>
  </div>
  <div id="main-area">
    <div id="file-drawer">
      <div class="drawer-list" id="file-list"></div>
    </div>
    <div id="content-wrapper">
      <article id="content" class="markdown-body"></article>
    </div>
    <div id="empty-state">
      <div class="empty-message">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>
        </svg>
        <p>Open a Markdown file to get started</p>
        <p class="hint">Ctrl+O to open &middot; drag &amp; drop &middot; Ctrl+T for themes</p>
      </div>
    </div>
  </div>
  <!-- Recent files dropdown -->
  <div id="recent-panel">
    <div class="recent-panel-header">Recent Files</div>
    <div class="recent-panel-list" id="recent-list"></div>
    <div class="recent-panel-empty" id="recent-empty">No recent files</div>
  </div>
  <!-- Copy format dropdown -->
  <div id="copy-panel">
    <button class="copy-option" data-format="html">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <polyline points="4,4.5 1,8 4,11.5"/>
        <polyline points="12,4.5 15,8 12,11.5"/>
        <line x1="9.5" y1="3" x2="6.5" y2="13"/>
      </svg>
      Copy as HTML
    </button>
    <button class="copy-option" data-format="markdown">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="1" y="3" width="14" height="10" rx="1.5"/>
        <polyline points="4,9.5 5.5,7 7,9.5"/>
        <line x1="9" y1="7" x2="9" y2="9.5"/>
        <polyline points="11,9.5 12,7.5 13,9.5"/>
      </svg>
      Copy as Markdown
    </button>
  </div>
  <!-- Find in page bar -->
  <div id="find-bar">
    <input id="find-input" type="text" placeholder="Find in page…" autocomplete="off" spellcheck="false">
    <span id="find-count"></span>
    <button id="find-prev" title="Previous match (Shift+Enter)">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="2,8 6,4 10,8"/>
      </svg>
    </button>
    <button id="find-next" title="Next match (Enter)">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="2,4 6,8 10,4"/>
      </svg>
    </button>
    <button id="find-close" title="Close (Escape)">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="2" y1="2" x2="10" y2="10"/><line x1="10" y1="2" x2="2" y2="10"/>
      </svg>
    </button>
  </div>
  <!-- Theme picker panel -->
  <div id="theme-panel">
    <div class="theme-panel-header">Color Theme</div>
    <div class="theme-panel-list" id="theme-list"></div>
    <div class="theme-panel-divider"></div>
    <div class="theme-panel-header">Code Font</div>
    <div class="theme-panel-fonts">
      <div class="font-select-row">
        <select id="font-select"></select>
      </div>
    </div>
    <div class="theme-panel-footer">
      <button id="btn-import-theme" title="Import a custom theme JSON file">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M8 3v10M3 8h10"/>
        </svg>
        Import custom theme
      </button>
    </div>
  </div>
  <!-- About modal -->
  <div id="about-overlay">
    <div id="about-modal">
      <div class="about-logo">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.6">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>
        </svg>
      </div>
      <div class="about-title">smd</div>
      <div class="about-subtitle">Simple Markdown Viewer</div>
      <div class="about-version" id="about-version"></div>
      <button id="about-close">Close</button>
    </div>
  </div>
  <script src="highlight.min.js"></script>
  <script src="themes.js"></script>
  <script src="utils.js"></script>
  <script src="app.js"></script>
</body>
</html>
