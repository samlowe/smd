<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>smd</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="hljs-theme.css">
</head>
<body>
  <div id="toolbar">
    <div class="toolbar-left">
      <button id="btn-open" title="Open file (Ctrl+O)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M2 13V3a1 1 0 011-1h4l2 2h4a1 1 0 011 1v1M2 13l2-6h11l-2 6H2z"/>
        </svg>
      </button>
      <span id="filename"></span>
    </div>
    <div class="toolbar-right">
      <button id="btn-zoom-out" title="Zoom out (Ctrl+-)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5M5 7h4"/>
        </svg>
      </button>
      <span id="zoom-level">100%</span>
      <button id="btn-zoom-in" title="Zoom in (Ctrl++)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5M5 7h4M7 5v4"/>
        </svg>
      </button>
      <button id="btn-theme" title="Toggle theme (Ctrl+T)">
        <svg id="icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41"/>
        </svg>
        <svg id="icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="display:none">
          <path d="M13.36 10.06A6 6 0 015.94 2.64 6 6 0 1013.36 10.06z"/>
        </svg>
      </button>
    </div>
  </div>
  <div id="content-wrapper">
    <article id="content" class="markdown-body"></article>
  </div>
  <div id="empty-state">
    <div class="empty-message">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.4">
        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>
      </svg>
      <p>Open a Markdown file to get started</p>
      <p class="hint">Ctrl+O to open &middot; or drag &amp; drop a file</p>
    </div>
  </div>
  <script src="marked.min.js"></script>
  <script src="highlight.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
